<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/images/table.png">

    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Viaticos 2</title>
</head>

<body>
    <div class="container-sm">
        <h1>Viaticos</h1>

        <table id="entry_table" class="table table-bordered">
        </table>

        <div class="container p-3">
          <h4>Acciones tabla</h4>
          <div class="d-flex flex-row bd-highlight justify-content-between">
              <button id="btnRep" class="btn btn-outline-info">Generar reporte</button>
              <button id="btnShr" class="btn btn-outline-dark">Compartir</button>
              <button class="btn btn-outline-danger" data-bs-toggle="modal"  data-bs-target="#Modal">Borrar datos de la tabla</button>
          </div>
        </div>
        
    </div>

    <form class="container">
        <h4>Info del servicio</h4>
        <div class="mb-3">
        <label class="form-label" for="in_date">Fecha de servicio</label>
        <input class="form-control" type="date" name="in_date" id="in_date" placeholder="" required="required">
        </div>

        <div class="mb-3">
        <label class="form-label" for="in_ticket">Ticket del servicio</label>
        <input class="form-control" type="text" name="in_ticket" id="in_ticket" placeholder="NA">
        </div>

        <div class="mb-3">
        <label class="form-label" for="in_pr">Serie de las impresora</label>
        <input class="form-control" type="text" name="in_pr" id="in_pr" placeholder="">
        </div>

        <div class="mb-3">
        <label class="form-label" for="in_ruta">Ruta</label>
        <select class="form-select" name="in_ruta" id="in_ruta">
        </select>
        </div>

        <div class="mb-3">
        <label class="form-label" for="in_obs">Observaciones</label>
        <input class="form-control" type="text" name="in_obs" id="in_obs" placeholder="Sin Observaciones">
        </div>

        <input type="button" class="btn btn-outline-primary" value="Agregar" id="btnAdd">
        <input type="reset" class="btn btn-outline-danger" value="Borrar datos">
    </form>
</div>

<div class="modal fade" id="Modal" tabindex="-1" aria-labelledby="ModalLabel" aria-hidden="true" id="modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ModalLabel">Esta seguro de borrar los registros de la tabla</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="btnClear">Si, Borrar</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="Modal2" tabindex="-2" aria-labelledby="ModalLabel2" aria-hidden="false">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ModalLabel2">Esta seguro de borrar los registros de la tabla</h5>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="btnSave">Guardar</button>
        <button type="button" class="btn-close" data-bs-dismiss="Modal2" aria-label="Close"></button>
      </div>
    </div>
  </div>
</div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
  <div id="toast" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-body bg-ligth">
      Url copiada al portapapeles.
    </div>
  </div>
</div>


</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</html>
